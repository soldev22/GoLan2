name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Go tests
        run: go test ./...

  ui-tests:
    runs-on: ubuntu-latest
    needs: go-tests
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install UI dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start app
        run: WEATHER_APP_WEATHER_REQUEST_TIMEOUT_SEC=2 go run ./cmd/server > server.log 2>&1 &

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become healthy"
          cat server.log
          exit 1

      - name: Run UI tests
        env:
          BASE_URL: http://localhost:8080
        run: npm run ui:test
